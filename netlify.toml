[build]
  command = "npm run build:site"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Always revalidate the service worker and app shell so updates reach
# installed copies; sw.js then handles offline caching itself.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self)"

# v1.sudoku.bristoljon.uk (a domain alias on this project) serves the v1
# branch deploy: the original hand-coded app, tagged v1.0.
[[redirects]]
  from = "https://v1.sudoku.bristoljon.uk/*"
  to = "https://v1--bristoljon-sudoku.netlify.app/:splat"
  status = 200
  force = true
